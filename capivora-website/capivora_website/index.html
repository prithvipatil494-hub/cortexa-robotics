<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capivora Robotics — Making Every Production Line Intelligent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..800,0..100&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #050505;
    --ink: #0A0A0A;
    --ink-2: #141414;
    --ink-3: #1e1e1e;
    --paper: #EDE9DE;
    --paper-2: #E0DCD0;
    --paper-3: #D2CDBE;
    --red: #C2352A;
    --red-dark: #9c211a;
    --blueprint: #5F7A88;
    --dust: #837F72;
    --hairline: rgba(237, 233, 222, 0.14);
    --hairline-dark: rgba(10, 10, 10, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  /* Humanist serif display class */
  .serif {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 144, 'SOFT' 60;
    font-weight: 500;
  }
  .serif-bold {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 144, 'SOFT' 40;
    font-weight: 700;
  }

  .container { max-width: 1260px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 640px) { .container { padding: 0 20px; } }

  /* ============ VIDEO INTRO OVERLAY ============ */
  .video-intro {
    position: fixed; inset: 0; z-index: 9999;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    overflow: hidden;
    transition: opacity 0.9s cubic-bezier(0.7, 0, 0.3, 1);
  }
  .video-intro.exiting {
    opacity: 0;
    pointer-events: none;
  }
  .video-intro-scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .yt-frame-wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .yt-frame-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .intro-sound {
    position: absolute;
    top: 20px; right: 130px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(237, 233, 222, 0.75);
    padding: 8px 14px;
    border: 1px solid rgba(237, 233, 222, 0.25);
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    letter-spacing: 0.06em;
  }
  .intro-sound:hover {
    color: var(--paper);
    border-color: var(--paper);
    background: rgba(0, 0, 0, 0.6);
  }
  .intro-sound svg { flex-shrink: 0 }
  @media (max-width: 640px) {
    .intro-sound { top: 14px; right: 88px; font-size: 10px; padding: 6px 10px; gap: 6px; }
    .intro-sound span { display: none; }
  }
  .intro-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.65) 100%);
    z-index: 2;
  }
  .intro-corner {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(237, 233, 222, 0.75);
    letter-spacing: 0.12em;
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .intro-corner.tl { top: 20px; left: 24px; }
  .intro-corner.bl { bottom: 22px; left: 24px; flex-direction: column; align-items: flex-start; gap: 6px; }
  .intro-corner.br { bottom: 22px; right: 24px; flex-direction: column; align-items: flex-end; gap: 6px; }
  .intro-corner .rec-dot {
    width: 8px; height: 8px;
    background: var(--red);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(194,53,42,0.7);
    animation: rec-blink 1.4s ease-in-out infinite;
  }
  @keyframes rec-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .intro-corner .tagline-serif {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 40, 'SOFT' 90;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.01em;
    color: rgba(237, 233, 222, 0.9);
    text-transform: none;
    opacity: 0;
    animation: fade-in 0.8s ease-out forwards 4s;
  }
  @keyframes fade-in { to { opacity: 1; } }

  .intro-skip {
    position: absolute;
    top: 20px; right: 24px;
    z-index: 5;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(237, 233, 222, 0.75);
    padding: 8px 14px;
    border: 1px solid rgba(237, 233, 222, 0.25);
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    letter-spacing: 0.06em;
  }
  .intro-skip:hover {
    color: var(--paper);
    border-color: var(--paper);
    background: rgba(194, 53, 42, 0.3);
  }

  @media (max-width: 640px) {
    .intro-corner { font-size: 9px; letter-spacing: 0.08em; }
    .intro-corner.tl { top: 14px; left: 14px; }
    .intro-corner.bl { bottom: 16px; left: 14px; }
    .intro-corner.br { bottom: 16px; right: 14px; }
    .intro-corner .tagline-serif { font-size: 11px; }
    .intro-skip { top: 14px; right: 14px; font-size: 10px; padding: 6px 10px; }
  }

  /* ============ NAV ============ */
  .nav {
    background: var(--black);
    color: var(--paper);
    border-bottom: 1px solid var(--hairline);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0; gap: 24px;
  }
  .brand { display: flex; align-items: center; height: 32px; }
  .brand img { height: 100%; width: auto; display: block; }
  .nav-links {
    display: flex; gap: 34px;
    font-size: 14px;
    color: rgba(237, 233, 222, 0.68);
  }
  .nav-links a { transition: color 0.15s; position: relative; }
  .nav-links a:hover { color: var(--paper); }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-linkedin {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px;
    border: 1px solid rgba(237,233,222,0.25);
    color: rgba(237,233,222,0.68);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .nav-linkedin:hover { background: var(--paper); color: var(--black); border-color: var(--paper); }
  .nav-cta {
    font-size: 13px; font-weight: 500;
    padding: 10px 18px;
    border: 1px solid var(--paper);
    color: var(--paper);
    transition: background 0.15s, color 0.15s;
  }
  .nav-cta:hover { background: var(--paper); color: var(--black); }
  @media (max-width: 780px) { .nav-links { display: none; } }
  @media (max-width: 480px) { .nav-cta { display: none; } }

  /* ============ HERO ============ */
  .hero {
    background: var(--black);
    color: var(--paper);
    padding: 88px 0 116px;
    position: relative;
    overflow: hidden;
  }
  .hero-grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--hairline) 1px, transparent 1px),
      linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at 60% 40%, black 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 60% 40%, black 20%, transparent 75%);
  }
  .hero-inner {
    position: relative;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 64px;
    align-items: center;
  }
  @media (max-width: 900px) {
    .hero-inner { grid-template-columns: 1fr; gap: 48px; }
    .hero { padding: 64px 0 80px; }
  }

  .hero-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--blueprint);
    letter-spacing: 0.04em;
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .hero-label::before { content: ''; width: 28px; height: 1px; background: var(--blueprint); }

  .hero-tagline-band {
    display: inline-flex;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--paper);
    padding: 7px 14px 7px 12px;
    border: 1px solid var(--blueprint);
    letter-spacing: 0.02em;
    margin-bottom: 26px;
  }
  .hero-tagline-band .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--red);
    border-radius: 50%;
    margin-right: 12px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .hero h1 {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 144, 'SOFT' 50;
    font-weight: 500;
    font-size: clamp(44px, 6.4vw, 88px);
    line-height: 1.0;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
  }
  .hero h1 .accent {
    color: var(--red);
    font-style: italic;
    font-variation-settings: 'opsz' 144, 'SOFT' 100;
    font-weight: 500;
  }
  .hero-lede {
    font-size: 17px;
    line-height: 1.6;
    color: rgba(237, 233, 222, 0.72);
    max-width: 500px;
    margin-bottom: 40px;
  }
  .hero-actions {
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  .btn-primary {
    background: var(--red);
    color: var(--paper);
    padding: 14px 24px;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-ghost {
    color: var(--paper);
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 500;
    border-bottom: 1px solid rgba(237, 233, 222, 0.4);
    transition: border-color 0.15s;
  }
  .btn-ghost:hover { border-bottom-color: var(--paper); }

  /* ============ SCHEMATIC ============ */
  .schematic {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 480px;
    justify-self: end;
  }
  @media (max-width: 900px) {
    .schematic { justify-self: center; max-width: 380px; }
  }
  .schematic svg { width: 100%; height: 100%; }
  .schematic .corner-mark {
    position: absolute; width: 14px; height: 14px;
    border-color: var(--blueprint); border-style: solid; border-width: 0;
  }
  .corner-mark.tl { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
  .corner-mark.tr { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
  .corner-mark.bl { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
  .corner-mark.br { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }

  /* ============ SECTIONS ============ */
  section { padding: 100px 0; }
  @media (max-width: 640px) { section { padding: 64px 0; } }

  .section-header {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 48px;
    margin-bottom: 64px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--hairline-dark);
  }
  @media (max-width: 780px) {
    .section-header { grid-template-columns: 1fr; gap: 16px; margin-bottom: 48px; }
  }
  .section-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--blueprint);
    letter-spacing: 0.02em;
    padding-top: 8px;
  }
  .section-title {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 144, 'SOFT' 60;
    font-weight: 500;
    font-size: clamp(30px, 3.8vw, 50px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    max-width: 740px;
  }
  .section-title em {
    font-style: italic;
    font-variation-settings: 'opsz' 144, 'SOFT' 100;
    color: var(--red);
  }

  /* ============ MISSION ============ */
  .mission-band {
    background: var(--paper);
    padding: 120px 0;
    position: relative;
  }
  @media (max-width: 640px) { .mission-band { padding: 80px 0; } }
  .mission-inner {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 48px;
  }
  @media (max-width: 780px) { .mission-inner { grid-template-columns: 1fr; gap: 32px; } }
  .mission-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--blueprint);
    letter-spacing: 0.02em;
    padding-top: 12px;
  }
  .mission-body { max-width: 780px; }
  .mission-statement {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 144, 'SOFT' 70;
    font-weight: 500;
    font-size: clamp(28px, 3.4vw, 42px);
    line-height: 1.15;
    letter-spacing: -0.015em;
    margin-bottom: 40px;
    color: var(--ink);
  }
  .mission-statement em {
    font-style: italic;
    font-variation-settings: 'opsz' 144, 'SOFT' 100;
    color: var(--red);
  }
  .mission-para {
    font-size: 17px;
    line-height: 1.7;
    color: var(--ink-2);
    max-width: 620px;
    margin-bottom: 18px;
  }
  .mission-para:last-child { margin-bottom: 0; }
  .mission-para strong {
    font-weight: 500;
    color: var(--ink);
    border-bottom: 1px solid var(--red);
    padding-bottom: 1px;
  }

  /* ============ CAPABILITIES ============ */
  .capability {
    display: grid;
    grid-template-columns: 90px 1fr 1.2fr;
    gap: 32px;
    padding: 34px 0;
    border-top: 1px solid var(--hairline-dark);
    align-items: start;
  }
  .capability:last-child { border-bottom: 1px solid var(--hairline-dark); }
  @media (max-width: 780px) {
    .capability { grid-template-columns: 1fr; gap: 12px; padding: 28px 0; }
  }
  .capability-index {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--dust);
    padding-top: 8px;
  }
  .capability-name {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 60, 'SOFT' 60;
    font-weight: 500;
    font-size: 26px;
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .capability-body {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink-2);
  }

  /* ============ APPROACH ============ */
  .approach-band {
    background: var(--black);
    color: var(--paper);
  }
  .approach-band .section-tag { color: var(--blueprint); }
  .approach-band .section-title { color: var(--paper); }
  .approach-band .section-header { border-bottom-color: var(--hairline); }
  .approach-grid {
    display: grid;
    grid-template-columns: 220px repeat(3, 1fr);
    gap: 48px;
  }
  @media (max-width: 900px) { .approach-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .approach-grid { grid-template-columns: 1fr; } }
  .approach-empty { display: block; }
  @media (max-width: 900px) { .approach-empty { display: none; } }
  .approach-item h3 {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 60, 'SOFT' 60;
    font-weight: 500;
    font-size: 22px;
    margin-bottom: 12px;
    line-height: 1.2;
  }
  .approach-item p {
    font-size: 14px;
    line-height: 1.65;
    color: rgba(237, 233, 222, 0.68);
  }
  .approach-item .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--red);
    display: block;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--hairline);
  }

  /* ============ STATS BAND ============ */
  .stats-band {
    padding: 96px 0;
    background: var(--paper);
    border-top: 1px solid var(--hairline-dark);
  }
  @media (max-width: 640px) { .stats-band { padding: 64px 0; } }
  .stats-header {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 48px;
    margin-bottom: 56px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--hairline-dark);
    align-items: end;
  }
  @media (max-width: 780px) {
    .stats-header { grid-template-columns: 1fr; gap: 12px; margin-bottom: 40px; }
  }
  .stats-heading {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 144, 'SOFT' 60;
    font-weight: 500;
    font-size: clamp(26px, 3.2vw, 40px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    max-width: 640px;
  }
  .stats-heading em {
    font-style: italic;
    font-variation-settings: 'opsz' 144, 'SOFT' 100;
    color: var(--red);
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
  }
  .stat-item {
    padding: 4px 24px;
    border-left: 1px solid var(--hairline-dark);
  }
  .stat-item:first-child { border-left: none; padding-left: 0; }
  .stat-item:last-child { padding-right: 0; }
  .stat-number {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 144, 'SOFT' 40;
    font-weight: 500;
    font-size: clamp(48px, 6vw, 76px);
    line-height: 0.95;
    color: var(--ink);
    letter-spacing: -0.03em;
    margin-bottom: 18px;
    display: inline-flex;
    align-items: baseline;
  }
  .stat-suffix, .stat-prefix {
    font-size: 0.42em;
    color: var(--red);
    font-style: italic;
    font-variation-settings: 'opsz' 144, 'SOFT' 100;
    margin: 0 3px;
    letter-spacing: 0;
  }
  .stat-prefix { margin-right: 4px; }
  .stat-label {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-2);
    max-width: 220px;
  }
  @media (max-width: 900px) {
    .stats-grid { grid-template-columns: 1fr 1fr; row-gap: 40px; }
    .stat-item:nth-child(3) { border-left: none; padding-left: 0; padding-top: 40px; border-top: 1px solid var(--hairline-dark); margin-top: -40px; }
    .stat-item:nth-child(4) { padding-top: 40px; border-top: 1px solid var(--hairline-dark); margin-top: -40px; }
  }
  @media (max-width: 560px) {
    .stats-grid { grid-template-columns: 1fr; row-gap: 32px; }
    .stat-item { border-left: none !important; padding-left: 0 !important; padding-top: 32px !important; border-top: 1px solid var(--hairline-dark); margin-top: 0 !important; }
    .stat-item:first-child { border-top: none; padding-top: 0 !important; }
  }

  /* ============ TERMINAL TELEMETRY ============ */
  .telemetry-band {
    background: var(--paper);
    padding: 100px 0;
    border-top: 1px solid var(--hairline-dark);
  }
  @media (max-width: 640px) { .telemetry-band { padding: 64px 0; } }
  .telemetry-header {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 48px;
    margin-bottom: 48px;
    align-items: end;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--hairline-dark);
  }
  @media (max-width: 780px) { .telemetry-header { grid-template-columns: 1fr; gap: 20px; margin-bottom: 32px; } }
  .telemetry-header .section-title { font-size: clamp(28px, 3.6vw, 44px); max-width: 620px; }
  .telemetry-lede {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink-2);
    max-width: 440px;
    justify-self: end;
  }
  @media (max-width: 780px) { .telemetry-lede { justify-self: start; max-width: 620px; } }
  .terminal {
    background: #0a0d13;
    border: 1px solid #1c212b;
    color: #a8b2c0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  }
  .terminal-chrome {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background: #14181f;
    border-bottom: 1px solid #1c212b;
    gap: 16px;
  }
  .terminal-dots { display: flex; gap: 7px; }
  .terminal-dots span {
    width: 10px; height: 10px;
    background: #2a303c;
    border-radius: 50%;
  }
  .terminal-dots span:nth-child(1) { background: #C2352A; }
  .terminal-dots span:nth-child(2) { background: #d4a017; }
  .terminal-dots span:nth-child(3) { background: #4a8f4a; }
  .terminal-title {
    flex: 1;
    text-align: center;
    color: #5F7A88;
    font-size: 11px;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const LOGO_LIGHT = 'assets/logo.png';
    const LOGO_DARK = 'assets/logo-dark.png';
    const LINKEDIN_URL = 'https://www.linkedin.com/company/capivora-robotics/posts/?feedView=all';

    /* ================================================================ */
    /*  YOUTUBE INTRO OVERLAY                                           */
    /* ================================================================ */
    const YOUTUBE_VIDEO_ID = 'Fh5HVdrcZmo';

    function YouTubeIntro() {
      const [gone, setGone] = useState(false);
      const [exiting, setExiting] = useState(false);
      const [muted, setMuted] = useState(true);
      const iframeRef = React.useRef(null);

      useEffect(() => {
        let seen = false;
        try { seen = sessionStorage.getItem('capivora-intro-yt-seen') === '1'; } catch (e) {}
        if (seen) setGone(true);
      }, []);

      // Listen for YouTube iframe postMessage events (video ended)
      useEffect(() => {
        const handleMessage = (event) => {
          const origin = event.origin || '';
          if (!origin.includes('youtube.com') && !origin.includes('youtube-nocookie.com')) return;
          try {
            const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
            if (data && data.event === 'onStateChange' && (data.info === 0 || data.info === 5)) {
              // 0 = ended, 5 = cued (initial)
              if (data.info === 0) setExiting(true);
            }
          } catch (e) { /* ignore non-JSON messages */ }
        };
        window.addEventListener('message', handleMessage);
        return () => window.removeEventListener('message', handleMessage);
      }, []);

      // Once iframe loads, subscribe to state-change events
      const handleIframeLoad = () => {
        const iframe = iframeRef.current;
        if (!iframe || !iframe.contentWindow) return;
        setTimeout(() => {
          try {
            iframe.contentWindow.postMessage(
              JSON.stringify({ event: 'listening', id: 1 }),
              '*'
            );
            iframe.contentWindow.postMessage(
              JSON.stringify({ event: 'command', func: 'addEventListener', args: ['onStateChange'] }),
              '*'
            );
          } catch (e) { /* iframe origin unreachable, timer will fall back */ }
        }, 300);
      };

      // Fallback timer in case postMessage subscription fails
      useEffect(() => {
        if (gone) return;
        const t = setTimeout(() => setExiting(true), 45000);
        return () => clearTimeout(t);
      }, [gone]);

      useEffect(() => {
        if (!exiting) return;
        const t = setTimeout(() => {
          try { sessionStorage.setItem('capivora-intro-yt-seen', '1'); } catch (e) {}
          setGone(true);
        }, 900);
        return () => clearTimeout(t);
      }, [exiting]);

      const dismiss = () => setExiting(true);

      const toggleMute = () => {
        const iframe = iframeRef.current;
        if (!iframe || !iframe.contentWindow) return;
        try {
          iframe.contentWindow.postMessage(
            JSON.stringify({ event: 'command', func: muted ? 'unMute' : 'mute', args: [] }),
            '*'
          );
          setMuted(!muted);
        } catch (e) {}
      };

      if (gone) return null;

      const ytUrl =
        `https://www.youtube-nocookie.com/embed/${YOUTUBE_VIDEO_ID}` +
        `?autoplay=1&mute=1&controls=0&showinfo=0&rel=0` +
        `&modestbranding=1&playsinline=1&iv_load_policy=3&fs=0&disablekb=1` +
        `&cc_load_policy=0&enablejsapi=1`;

      return (
        <div className={`video-intro ${exiting ? 'exiting' : ''}`} role="dialog" aria-label="Capivora Robotics intro">
          <div className="intro-corner tl">
            <span className="rec-dot"></span>REC · CELL CPV-01
          </div>

          <button className="intro-skip" onClick={dismiss}>Skip intro</button>

          <button className="intro-sound" onClick={toggleMute} aria-label={muted ? 'Unmute' : 'Mute'}>
            {muted ? (
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <line x1="23" y1="9" x2="17" y2="15"/>
                <line x1="17" y1="9" x2="23" y2="15"/>
              </svg>
            ) : (
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
            )}
            <span>{muted ? 'Sound on' : 'Sound off'}</span>
          </button>

          <div className="video-intro-scene">
            <div className="yt-frame-wrap">
              <iframe
                ref={iframeRef}
                src={ytUrl}
                title="Capivora Robotics"
                frameBorder="0"
                allow="autoplay; encrypted-media; picture-in-picture"
                onLoad={handleIframeLoad}
              ></iframe>
            </div>
            <div className="intro-vignette"></div>
          </div>

          <div className="intro-corner bl">
            <span>CHENNAI · TAMIL NADU · IN</span>
            <span className="tagline-serif">Making every production line intelligent.</span>
          </div>

          <div className="intro-corner br">
            <span>YOUTUBE · {YOUTUBE_VIDEO_ID}</span>
            <span className="tagline-serif">Built for the humans on the other side of the safety line.</span>
          </div>
        </div>
      );
    }

    /* ============ TERMINAL TELEMETRY ============ */
    function Telemetry() {
      const [lines, setLines] = useState([]);

      useEffect(() => {
        const templates = [
          { tag: 'RUN', msg: 'cell-01.status=RUNNING  cycle=0.82s  ±0.03mm', flag: '✓' },
          { tag: 'VIS', msg: 'vision.calibration=auto  drift=0.001', flag: '✓' },
          { tag: 'PIC', msg: 'part.detected #48291  gripper.close', flag: '✓' },
          { tag: 'PLC', msg: 'place.confirmed station=B  next.cycle', flag: '↻' },
          { tag: 'SYS', msg: 'temp=42°C  power=1.2kW  uptime=847h', flag: '' },
          { tag: 'RUN', msg: 'cell-02.status=RUNNING  cycle=1.14s', flag: '✓' },
          { tag: 'OEE', msg: 'oee=94.2%  avail=98.1%  quality=99.8%', flag: '' },
          { tag: 'ALT', msg: 'no anomalies detected  continuing', flag: '✓' },
          { tag: 'PIC', msg: 'part.detected #48292  gripper.close', flag: '✓' },
          { tag: 'ENV', msg: 'chamber sealed  O₂=20.9%  humidity=42%', flag: '✓' }
        ];

        const stamp = (offset) => {
          const now = new Date(Date.now() - offset * 1000);
          return String(now.getHours()).padStart(2,'0') + ':' +
                 String(now.getMinutes()).padStart(2,'0') + ':' +
                 String(now.getSeconds()).padStart(2,'0');
        };
        let counter = 0;
        const genLine = (offset = 0) => {
          const template = templates[counter++ % templates.length];
          return { ts: stamp(offset), ...template, id: counter + '_' + Math.random().toString(36).slice(2, 8) };
        };

        setLines(Array.from({ length: 6 }, (_, i) => genLine((5 - i) * 2)));

        const interval = setInterval(() => {
          setLines(prev => [...prev.slice(-5), genLine(0)]);
        }, 1800);

        return () => clearInterval(interval);
      }, []);

      return (
        <section className="telemetry-band">
          <div className="container">
            <div className="telemetry-header">
              <div>
                <div className="section-tag">// live from a cell</div>
                <h2 className="section-title">
                  Every cell reports what it is <em>doing.</em>
                </h2>
              </div>
              <p className="telemetry-lede">
                Line intelligence isn't a dashboard we sell as an add-on — it
                ships with every cell we build. This is what the stream looks
                like from a healthy cell: cycle time, drift, place
                confirmations, OEE.
              </p>
            </div>
            <div className="terminal">
              <div className="terminal-chrome">
                <div className="terminal-dots"><span></span><span></span><span></span></div>
                <div className="terminal-title">capivora · cell-01.stream</div>
                <div className="terminal-live">
                  <span className="terminal-live-dot"></span>LIVE
                </div>
              </div>
              <div className="terminal-body">
                {lines.map(line => (
                  <div className="terminal-line" key={line.id}>
                    <span className="terminal-ts">[{line.ts}]</span>
                    <span className="terminal-tag">{line.tag}</span>
                    <span className="terminal-msg">{line.msg}</span>
                    <span className={`terminal-flag ${line.flag === '✓' ? 'ok' : line.flag === '↻' ? 'run' : ''}`}>{line.flag}</span>
                  </div>
                ))}
                <div className="terminal-cursor-line">
                  tail -f<span className="terminal-cursor"></span>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }
